name: Update Purchase Preview

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-purchase:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install pillow

      - name: Generate purchase image
        run: python scripts/generate_purchase_image.py

      - name: Update purchase page
        run: python scripts/build_purchase_page.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add html/purchase7.html html/PNG/purchase-current.png
          git commit -m "Auto update purchase preview" || echo "No changes to commit"
          git push
