<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>咖啡搭配｜美廉社 Simple Mart</title>

  <!-- 給 LINE/FB 的預覽資料 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="咖啡搭配組合｜美廉社">
  <meta property="og:description" content="大杯咖啡搭配茶葉蛋超值組合，每日限量供應！">
  <meta property="og:image" content="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/咖啡搭配.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ✨ 非常重要：手機版寬度用這個 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    /* 手機版：當成預設樣式 */
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f3f9;
      color: #333;
      position: relative;
      min-height: 100vh;
    }

    /* 背景淡 Logo（手機版較小） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/Simple_Mart_logo.png")
                  no-repeat center center;
      background-size: 90vw;
      opacity: 0.06;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 12px auto;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 2px solid #b2128b;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .store-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(90deg, #b2128b, #e22fb0);
      color: #fff;
    }

    .store-logo {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
      object-fit: contain;
      margin-right: 10px;
    }

    .store-name-main {
      font-size: 18px;
      font-weight: 700;
    }

    .store-name-sub {
      font-size: 12px;
      opacity: 0.9;
    }

    .banner-image {
      display: block;
      width: 100%;
    }

    .content {
      padding: 14px 16px 18px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #b2128b;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .item-list {
      border-top: 1px dashed #e0d0e7;
      padding-top: 8px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
    }

    .item-detail {
      font-size: 12px;
      color: #666;
    }

    .item-price {
      font-size: 18px;
      font-weight: 700;
      color: #d9534f;
      margin-left: 6px;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: right;
    }

    /* 這裡開始是「較大螢幕」才套用：平板 / 桌機加強版 */

    @media (min-width: 768px) {
      body::before {
        background-size: 55%;
        opacity: 0.05;
      }

      .container {
        max-width: 780px;
        margin: 24px auto;
        padding: 18px;
      }

      .store-logo {
        width: 50px;
        height: 50px;
        padding: 6px;
      }

      .store-name-main {
        font-size: 20px;
      }

      .store-name-sub {
        font-size: 13px;
      }

      .title {
        font-size: 24px;
      }

      .item-name {
        font-size: 18px;
      }

      .item-price {
        font-size: 20px;
      }
    }

    @media (min-width: 1200px) {
      body {
        background: #f4edf7;
      }

      body::before {
        background-size: 40%;
      }

      .container {
        max-width: 900px;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="store-header">
        <img class="store-logo"
             src="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/Simple_Mart_logo.png">
        <div>
          <div class="store-name-main">美廉社 Simple Mart</div>
          <div class="store-name-sub">限時超值搭配組合</div>
        </div>
      </div>

      <img class="banner-image"
           src="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/咖啡搭配.jpg">

      <div class="content">
        <div class="title">咖啡搭配組合</div>
        <div class="subtitle">大杯經典咖啡搭配熱騰騰茶葉蛋，美味又超值。</div>

        <div class="item-list">
          <div class="item-row">
            <div>
              <div class="item-name">大杯美式咖啡</div>
              <div class="item-detail">＋ 茶葉蛋兩顆</div>
            </div>
            <div class="item-price">39元</div>
          </div>

          <div class="item-row">
            <div>
              <div class="item-name">大杯拿鐵咖啡</div>
              <div class="item-detail">＋ 茶葉蛋兩顆</div>
            </div>
            <div class="item-price">49元</div>
          </div>
        </div>

        <div class="note">※ 商品以門市實際供應為主，數量有限售完為止。</div>
      </div>
    </div>
  </div>
</body>
</html>
