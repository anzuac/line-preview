<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>咖啡搭配</title>

  <!-- 給 LINE / FB / Twitter 的 OGP 標籤 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="咖啡搭配組合">
  <meta property="og:description" content="大杯經典系列咖啡搭配茶葉蛋，超值組合！">

  <!-- LINE 顯示的縮圖：用咖啡搭配那張圖 -->
  <meta property="og:image" content="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/咖啡搭配.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f3f9;
      color: #333;
      position: relative;
      min-height: 100vh;
    }

    /* 背景淡淡的 Logo 水印 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/simplemart-logo.png")
                  no-repeat center center;
      background-size: 55%;
      opacity: 0.04;          /* 水印淡度 */
      pointer-events: none;
    }

    .container {
      max-width: 640px;
      margin: 20px auto;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      overflow: hidden;
      border: 2px solid #b2128b;
    }

    /* 頂部超商色條 + Logo 區 */
    .store-header {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: linear-gradient(90deg, #b2128b, #e22fb0);
      color: #fff;
    }

    .store-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      padding: 4px;
      margin-right: 10px;
      object-fit: contain;
    }

    .store-name-main {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .store-name-sub {
      font-size: 12px;
      opacity: 0.9;
    }

    .banner-image {
      width: 100%;
      display: block;
    }

    .content {
      padding: 16px 18px 18px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #b2128b;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .item-list {
      border-top: 1px dashed #e0d0e7;
      padding-top: 10px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      font-size: 16px;
    }

    .item-name {
      font-weight: 500;
    }

    .item-detail {
      font-size: 13px;
      color: #666;
    }

    .item-price {
      font-weight: 700;
      color: #d9534f;
      font-size: 18px;
      margin-left: 8px;
    }

    .note {
      margin-top: 10px;
      font-size: 12px;
      color: #999;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">

      <!-- 超商頭條 + Logo -->
      <div class="store-header">
        <!-- 這裡放美廉社 Logo -->
        <img class="store-logo"
             src="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/simplemart-logo.png"
             alt="Simple Mart Logo">
        <div>
          <div class="store-name-main">美廉社 Simple Mart</div>
          <div class="store-name-sub">咖啡搭配期間限定組合</div>
        </div>
      </div>

      <!-- 主圖片（咖啡搭配海報） -->
      <img class="banner-image"
           src="https://raw.githubusercontent.com/anzuac/line-preview/main/html/PNG/咖啡搭配.jpg"
           alt="咖啡搭配組合">

      <!-- 文字內容區 -->
      <div class="content">
        <div class="title">咖啡搭配組合</div>
        <div class="subtitle">大杯經典咖啡搭配熱騰騰茶葉蛋，早晚都超適合。</div>

        <div class="item-list">
          <div class="item-row">
            <div>
              <div class="item-name">大杯美式咖啡</div>
              <div class="item-detail">搭配茶葉蛋兩顆</div>
            </div>
            <div class="item-price">39元</div>
          </div>

          <div class="item-row">
            <div>
              <div class="item-name">大杯拿鐵咖啡</div>
              <div class="item-detail">搭配茶葉蛋兩顆</div>
            </div>
            <div class="item-price">49元</div>
          </div>
        </div>

        <div class="note">※ 依門市實際供應為主，數量有限售完為止。</div>
      </div>

    </div>
  </div>

</body>
</html>
