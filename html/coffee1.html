<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>咖啡搭配｜美廉社 Simple Mart</title>

  <!-- LINE/FB 預覽資料 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="咖啡搭配組合｜美廉社">
  <meta property="og:description" content="大杯咖啡搭配茶葉蛋超值組合，每日限量供應！">
  <meta property="og:image" content="https://anzuac.github.io/line-preview/html/PNG/coffee_promo.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", system-ui, sans-serif;
      background: #f7f3f9;
      color: #333;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("https://anzuac.github.io/line-preview/html/PNG/Simple_Mart_logo.png")
                  no-repeat center center;
      background-size: 90vw;
      opacity: 0.06;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 12px auto;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 2px solid #b2128b;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .store-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(90deg, #b2128b, #e22fb0);
      color: #fff;
    }

    .store-logo {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
      margin-right: 10px;
      object-fit: contain;
    }

    .store-name-main { font-size: 18px; font-weight: 700; }
    .store-name-sub { font-size: 12px; opacity: 0.9; }

    .banner-image { width: 100%; display: block; }

    .content { padding: 14px 16px 18px; }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: #b2128b;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .item-list {
      border-top: 1px dashed #e0d0e7;
      padding-top: 8px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .item-name { font-size: 16px; font-weight: 600; }
    .item-detail { font-size: 12px; color: #666; }

    .item-price {
      font-size: 18px;
      font-weight: 700;
      color: #d9534f;
      margin-left: 6px;
    }

    /* 🔥 自帶杯大提醒區塊 */
    .eco-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #ffeef9;
      border: 2px solid #ff78c7;
      text-align: center;
      font-weight: 700;
      font-size: 17px;
      color: #b2128b;
    }

    .eco-box span {
      font-size: 20px;
      color: #ff2fa3;
    }

    .note {
      text-align: right;
      margin-top: 10px;
      font-size: 11px;
      color: #999;
    }

    /* 平板 */
    @media (min-width: 768px) {
      body::before { background-size: 55%; }
      .container { max-width: 780px; padding: 18px; }
      .store-logo { width: 50px; height: 50px; padding: 6px; }
      .store-name-main { font-size: 20px; }
      .title { font-size: 24px; }
      .item-name { font-size: 18px; }
      .item-price { font-size: 20px; }
      .eco-box { font-size: 18px; }
      .eco-box span { font-size: 22px; }
    }

    /* PC */
    @media (min-width: 1200px) {
      body { background: #f4edf7; }
      body::before { background-size: 40%; }
      .container { max-width: 900px; }
      .title { font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <!-- 抬頭 -->
      <div class="store-header">
        <img class="store-logo"
             src="https://anzuac.github.io/line-preview/html/PNG/Simple_Mart_logo.png">
        <div>
          <div class="store-name-main">美廉社 Simple Mart</div>
          <div class="store-name-sub">限時超值搭配組合</div>
        </div>
      </div>

      <!-- 主圖 -->
      <img class="banner-image"
           src="https://anzuac.github.io/line-preview/html/PNG/coffee_promo.jpg">

      <!-- 內容 -->
      <div class="content">
        <div class="title">咖啡搭配組合</div>
        <div class="subtitle">大杯經典咖啡搭配熱騰騰茶葉蛋，美味又超值。</div>

        <div class="item-list">

          <!-- 原本價格組合 -->
          <div class="item-row">
            <div>
              <div class="item-name">大杯經典美式咖啡</div>
              <div class="item-detail">＋ 茶葉蛋兩顆</div>
            </div>
            <div class="item-price">39元</div>
          </div>

          <div class="item-row">
            <div>
              <div class="item-name">大杯鮮奶拿鐵咖啡</div>
              <div class="item-detail">＋ 茶葉蛋兩顆</div>
            </div>
            <div class="item-price">49元</div>
          </div>

          <!-- 新增：濃萃美式 / 拿鐵單售優惠 -->
          <div class="item-row">
            <div>
              <div class="item-name">大杯濃萃美式</div>
              <div class="item-detail">(單杯特價)</div>
            </div>
            <div class="item-price">29元</div>
          </div>

          <div class="item-row">
            <div>
              <div class="item-name">大杯拿鐵</div>
              <div class="item-detail">(單杯特價)</div>
            </div>
            <div class="item-price">39元</div>
          </div>

        </div>

        <!-- 🔥 自帶杯大提醒 -->
        <div class="eco-box">
          ♻️ 自帶杯 <span>再折 5 元</span>！
        </div>

        <div class="note">※ 商品以門市實際供應為主，數量有限售完為止。</div>
      </div>

    </div>
  </div>
</body>
</html>
