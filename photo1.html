<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>圖片預覽</title>

  <!-- 給 LINE / FB / Twitter 的 OGP 標籤 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="圖片預覽測試">
  <meta property="og:description" content="這是一個用 GitHub Pages 建立的圖片預覽卡片">

  <!-- ！！！！在這裡改成你的圖片網址！！！！ -->
  <meta property="og:image" content="https://raw.githubusercontent.com/anzuac/line-preview/main/IMG-2532.jpg">

  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">

  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <img src="https://raw.githubusercontent.com/anzuac/line-preview/main/IMG-2532.jpg" style="max-width:100%;">
</body>
</html>
